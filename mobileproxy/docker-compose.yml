
services:
  web:
    build: .
    container_name: mobileproxy-web
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - KRAKEN_API_URL=${KRAKEN_API_URL}
      - KRAKEN_API_KEY=${KRAKEN_API_KEY}
      - DATABASE_URL=postgresql://postgres:${UMAMI_DB_PASSWORD}@db:5432/kraken_metrics
    depends_on:
      - db
    restart: unless-stopped

  # ============================================
  # ОДИН PostgreSQL для всего
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: mobileproxy-db
    environment:
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
      POSTGRES_DB: umami  # База по умолчанию для Umami
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: mobileproxy-umami
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${UMAMI_DB_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  kraken-collector:
    build: .
    container_name: mobileproxy-kraken-collector
    command: python kraken_collector.py
    environment:
      - KRAKEN_API_URL=${KRAKEN_API_URL}
      - KRAKEN_API_KEY=${KRAKEN_API_KEY}
      - DATABASE_URL=postgresql://postgres:${UMAMI_DB_PASSWORD}@db:5432/kraken_metrics
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
    name: mobileproxy-db-data
